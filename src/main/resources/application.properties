spring.application.name=asset-hub
server.port=${SERVER_PORT:8080}

spring.datasource.url=${ASSET_HUB_DB_URL:jdbc:mysql://localhost:3306/assethub}
spring.datasource.username=${ASSET_HUB_DB_USERNAME:root}
spring.datasource.password=${ASSET_HUB_DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.sql.init.mode=never

logging.level.org.springframework.security=INFO
